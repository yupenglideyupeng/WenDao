# 项目相关配置
wendao:
  # 名称
  name: WenDao
  # 版本
  version: 3.9.2
  # 版权年份
  copyrightYear: 2026
  # 文件路径 示例（ Windows配置D:/wendao/uploadPath，Linux配置 /home/wendao/uploadPath）
  profile: D:/wendao/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math
  # AES加密密钥（32字符，用于敏感字段加解密）
  # 生产环境通过环境变量 WENDAO_AES_KEY 注入
  aes-key: ${WENDAO_AES_KEY:WenDao2026!AesKey#Secret@9876543}

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.wendao: ${LOG_LEVEL_COM_WENDAO:debug}
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置
    redis:
      # 地址
      host: localhost
      # 端口，默认为6379
      port: 6379
      # 数据库索引
      database: 4
      # 密码
      password:
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥（生产环境通过环境变量 TOKEN_SECRET 注入强随机字符串）
  secret: ${TOKEN_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 搜索指定包别名
  typeAliasesPackage: com.wendao.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    # 生产环境通过环境变量 SWAGGER_ENABLED=false 关闭
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      display-name: '测试模块'
      paths-to-match: '/**'
      packages-to-scan: com.wendao.web.controller.tool

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice,/news/**
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# AI新闻模块配置
news:
  # 抓取间隔(毫秒)，默认5分钟
  fetch-interval: 300000
  # 查询扩展配置
  query-expansion:
    # 是否启用查询扩展（同义词/相关词）
    enabled: true
    # 每个关键词最多扩展几个词
    max-terms: 3
  # 相关性过滤配置
  relevance:
    # 全局默认相关性阈值（低于此值的文章自动下架）
    default-threshold: 40
  # AI分析配置
  ai:
    # 是否启用AI分析
    enabled: true
    # AI API地址（默认DeepSeek，国内直连）
    api-url: https://api.deepseek.com/v1/chat/completions
    # 注意：API密钥和模型名称现由 news_model_config 表管理，此处不再需要
    # 仅保留 enabled 作为AI功能总开关
    # 模型名称（已废弃，由DB模型配置表管理）
    model: deepseek-chat
    # 超时时间(毫秒)
    timeout: 30000


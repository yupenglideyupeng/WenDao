# ============================================================
# WenDao Redis Configuration (Docker)
# ============================================================

# Bind to all interfaces (safe inside Docker network)
bind 0.0.0.0

# Port
port 6379

# Disable protected mode (safe within Docker bridge network)
protected-mode no

# ---- Persistence ----
# RDB snapshots
save 900 1
save 300 10
save 60 10000

# AOF (append-only file) for durability
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---- Memory Management ----
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---- Connection ----
timeout 300
tcp-keepalive 60

# ---- Databases ----
databases 16

# ---- Logging ----
loglevel notice
logfile ""

# ---- No password (matches existing app config) ----
# Set REDIS_PASSWORD in .env.docker to enable auth
# requirepass yourpassword
